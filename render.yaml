services:
  - type: web
    name: cineverse-backend
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4 api.app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TMDB_API_TOKEN
        sync: false
